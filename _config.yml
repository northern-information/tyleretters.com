blurb: I am a seasoned professional who has deployed countless products, solutions, and integrations in both B2B and B2C domains. After serving as Vice President at Highland, I took an IC position at Output, Inc. because I decided life is too short to not work at a music company. I love frontend engineering and my BFA in Graphic Design gives me a unique set of perspectives on the discipline of web development. If I'm not developing for the web I'm likely producing music.
