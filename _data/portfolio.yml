- title: FLASH CRASH
  class: row row-dark
  image: flash-crash.jpg
  url: https://flashcrash.net/archives
  notes: |
    FLASH CRASH is a recursive live-coding online event I organize. The brand dies and is reborn for each event. I design and develop the assets for the livestreams. Assets range from simple images to interactive cellular automata visualizers...

- title: Yggdrasil
  class: row row-dark
  video: |
    <iframe width="560" height="315" src="https://www.youtube.com/embed/8ac2qw9gmaw" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  url: https://northern-information.github.io/yggdrasil-docs/
  notes: |
    This class of software is known as a [tracker](https://en.wikipedia.org/wiki/Music_tracker) - which essentially allows you to make music with a spreadsheet. In addition to designing and developing the software, I also created the DSL (domain specific language) for scripting/live-coding.  

